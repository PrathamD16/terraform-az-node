name: Deploy Terraform Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Print current directory
        run: |
          pwd
          ls -la
          echo "Repo root: $GITHUB_WORKSPACE"

      - name: Run Terraform init via bash script
        run: |
          chmod +x scripts/run-terraform.sh
          ./scripts/run-terraform.sh init

      - name: Run Terraform plan via bash script
        run: |
          ./scripts/run-terraform.sh plan -var-file=../terraform/example.tfvars

      # - name: Run Terraform apply via bash script
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     ./scripts/run-terraform.sh apply -var-file=../terraform/example.tfvars -auto-approve
