name: Deploy Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Select Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: Select environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stg
          - prod

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Show resolved config path
        shell: bash
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Terraform config file: terraform/configurations/${{ inputs.environment }}/config.tfvars"
          ls -la
          ls -la terraform
          ls -la terraform/configurations
          ls -la "terraform/configurations/${{ inputs.environment }}"

      - name: Run Terraform
        shell: bash
        run: |
          chmod +x scripts/run-terraform.sh
          ./scripts/run-terraform.sh "${{ inputs.terraform_action }}" "${{ inputs.environment }}"
