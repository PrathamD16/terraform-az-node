name: Deploy Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Select the Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - init
          - plan
          - apply
          - destroy
      environment:
        description: Select the environment to deploy to
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      # tfvar_file:
      #   description: Relative path to the tfvars file, for example app_example/example.tfvars
      #   required: false
      #   default: app_example/example.tfvars
      #   type: string

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_FILE: ../terraform/${{ inputs.environment }}/config.tfvars

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Workspace Info
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Current directory: $(pwd)"
          echo "List files:"
          ls -la

      - name: Print current directory
        run: |
          pwd
          ls -la
          echo "Repo root: $GITHUB_WORKSPACE"
          echo "Selected action: ${{ inputs.terraform_action }}"
          echo "Selected tfvars file: $TF_VAR_FILE"

      # - name: Run Terraform ${{ inputs.terraform_action }}
      #   run: |
      #     chmod +x scripts/run-terraform.sh
      #     ./scripts/run-terraform.sh "${{ inputs.terraform_action }}"
